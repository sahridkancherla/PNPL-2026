# Trial 19: the continuous family. One model reads each item -- a sentence
# span or a 1 s lone word -- once, and reads every word out at its onset
# (src/pnpl2026/trial19/models/continuous.py). The DATA recipe is G2's:
# whole sentences, a tenth of them served as lone 1 s words; whole sentences
# end 1.13-1.68 s after their last onset, as the holdout's do.
#
# Layer order:  base.yaml -> trial19/trial19.yaml -> trial19/hpc.yaml -> one
# run file. model_kwargs merges key by key (trial19/config.py).
#
# Reads trial 10's cache and t5 table; builds neither. See
# src/pnpl2026/trial19/info/continuous.md.

# ⚠️ every run file overrides this
run_name: trial19

model: trial19_continuous

# -- data: trial 10's reference cache, 306 sensors at 50 Hz --------------------
cache_dir: data/trial10_reference
word_embeddings: data/word_embeddings_t5_all.npz
centre_embeddings: false
n_channels: 306
sfreq: 50

# The per-word window is only the "full" tail now; the per-ITEM baseline is
# the first 0.5 s of each item, clipped at +/-5 as before.
tmin: 0.0
tmax: 3.0
clamp: 5.0
baseline_seconds: 0.5

# Every word of a sentence is a token and a t5 target. Sentences are cut into
# runs of at most 16 words in training, so a span stays under ~8 s.
token_set: all
max_tokens: 16
siglip_dedup: true

# -- selection: the fragment protocol on pnpl's validation partition ----------
selection_protocol: fragment

# -- holdout-shaped training: G2's -------------------------------------------
fragment_p: 0.0
isolated_p: 0.1
fragment_lengths: [3, 1, 3, 25, 56, 38, 24, 12, 3]

# -- how a training span is cut (trial 19) -------------------------------------
whole_tail: holdout
lead_max_seconds: 0.0
marker_drop_p: 0.5
time_mask_p: 0.0

# -- the optional heads: off here; run files switch them on -------------------
phoneme_dir: ""
phoneme_weight: 0.5
phoneme_lag_seconds: 0.15
word_descriptions: ""
tower_dim: 256
tower_hidden: 512
tower_anchor_weight: 1.0
tower_score_mode: combine

model_kwargs:
  # -- spatial: brainmagick's merger, plus a learned offset per sensor type ----
  spatial: merger
  merger_channels: 270
  merger_pos_dim: 2048
  merger_dropout: 0.2
  merger_type_bias: true
  initial_linear: 270
  subject_layer: true

  # -- the stem: MEGState's four kernel lengths, then two LayerNorm blocks,
  #    then one step per 2 samples (25 steps/s at 50 Hz) --------------------------
  stem_kernels_ms: [500, 250, 125, 62.5]
  stem_channels: 64
  stem_depth: 2
  stem_kernel: 7
  stem_stride: 2

  # -- the time transformer: 6 x 256 x 8 heads over the steps ------------------
  d_model: 256
  time_depth: 6
  n_heads: 8
  ffn_expansion: 4
  attention_dropout: 0.1
  dropout: 0.0
  drop_path: 0.0

  # -- the readout: 0.5 s before each onset to 1.5 s after -------------------------
  onset_marker: true
  readout_before_s: 0.5
  readout_after_s: 1.5

# -- schedule: trial 10's ---------------------------------------------------------
# ⚠️ Exponents with a decimal point: PyYAML loads `1e-4` as a STRING.
lr: 1.0e-4
weight_decay: 0.01
warmup_fraction: 0.01
min_lr: 0.0
max_epochs: 50
patience: 10

# ITEMS per batch.
batch_size: 64

ema_decay: 0.0
jitter_seconds: 0.0

precision: "32"
matmul_precision: high
num_workers: 4
