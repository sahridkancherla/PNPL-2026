# Trial 19 on CX3: the machine-shaped knobs only. Layered after trial19.yaml
# and before the run file, so every run gets the same machine.

# ⚠️ Must equal ncpus in pbs/trial19.pbs.
num_workers: 8

# fp16 autocast for the RTX6000 that pbs/trial19.pbs asks for (Turing has no
# bf16); the loss, retrieval scores and the window statistics run in float32
# regardless.
precision: 16-mixed

# No thermal budget on a compute node: run flat out.
duty_cycle: 1.0
cooldown_every_minutes: 0.0
cooldown_seconds: 0.0

# cuda, not auto: auto falls back to the CPU without a word when no GPU is
# visible, and a CPU run quietly fills the whole walltime.
accelerator: cuda
