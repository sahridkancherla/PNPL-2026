# Trial 11: one stream per sentence, a Zipformer-style multi-rate encoder over
# it. THIS FILE IS Z1's base. Run files change one thing; runs.txt lists them
# with seeds.
#
# Layer order:  base.yaml -> trial11/trial11.yaml -> trial11/hpc.yaml -> one
# run file. model_kwargs merges key by key (trial11/config.py).
#
# Everything that is not the stream or the encoder is trial 8's E0: the same
# cache, trunk, heads, losses, schedule and augmentation.

# ⚠️ every run file overrides this
run_name: trial11

model: trial11_net

# -- data ------------------------------------------------------------------
# Trial 1's 73 whitened components, stored whole by trial 7's
# cli.build_continuous. Trial 11 has no builder: it reads trial 7's cache.
n_channels: 73
n_components: 73
continuous_dir: data/trial7_continuous

# ⚠️ tmax is the padded STREAM length here, not a per-word window. A stream
# runs from a sentence's first scored onset to its end: at most a 3.0 s onset
# span, a 1.7 s tail and 0.03 s of jitter, 4.73 s. The holdout's longest
# sentence epoch is 4.12 s. 4.8 s is 240 frames, which every stack factor tiles.
tmin: 0.0
tmax: 4.8
sfreq: 250

# -- holdout matching (measured on subject 0's holdout, 2026-09-30) ----------
# 1-9 scored words per sentence; the MEG stops 1.13-1.68 s after the last one
# (5th-95th percentile); 92 of 960 words stand alone with a 1 s window.
max_tokens: 9
tail_seconds: [1.1, 1.7]
isolated_fraction: 0.096
isolated_seconds: 1.0

# NEW: a training sentence is also cut wherever its first and last onsets would
# be more than 3 s apart, so every sequence fits one stream. Holdout sentences
# span under ~3 s, so this cuts only what the holdout never serves.
max_onset_span_seconds: 3.0

model_kwargs:
  # -- front end and trunk: trial 7's, once per sentence -----------------------
  lowpass_hz: 20.0
  fir_taps: 81
  decimate_factor: 5
  # No baseline: a stream's first 0.5 s is its first word's response, and trial
  # 6's C3 found no baseline +1.2 anyway.
  with_instance_norm: true
  spatial_width: 270
  initial_linear: 512
  trunk_hidden: 160
  trunk_depth: 5
  trunk_kernel: 3
  dilation_growth: 2
  # 1,2,4,8,16: each frame describes the waveform shape +/-0.6 s around it.
  dilation_period: null
  glu_every: 2
  trunk_dropout: 0.0

  # -- the Zipformer encoder ------------------------------------------------------
  # One stack per entry. A stack divides the 50 Hz rate by its factor,
  # runs its blocks there, repeats back to 50 Hz and blends with its input.
  #   factor   1     2      4       8       4       2
  #   rate     50    25     12.5    6.25    12.5    25   Hz
  #   tokens   240   120    60      30      60      120  per padded stream
  # A plain pre-norm block each (attention + FFN, 0.79M at d 256): 6.02M total.
  d_model: 256
  stack_factors: [1, 2, 4, 8, 4, 2]
  stack_depths: [1, 1, 1, 1, 1, 1]
  n_heads: 8
  ffn_expansion: 4
  dropout: 0.1
  drop_path: 0.1
  transformer_norm: layer

  # -- reading words off the stream -----------------------------------------------
  # Each word is attention-pooled over its own 1 s from onset (50 frames).
  readout_seconds: 1.0
  head_dropout: 0.1

# -- losses: trial 8's E0 ------------------------------------------------------
word_embeddings: data/word_embeddings_t5.npz
centre_embeddings: true
semantic_weight: 1.0
closed_set_weight: 1.0
inference_semantic_weight: 0.5
label_smoothing: 0.1
class_weight_power: 0.5
siglip_dedup: false

# Words are not tokens until the readout, so nothing can be masked.
word_mask_p: 0.0
mask_target: false

# -- schedule --------------------------------------------------------------
# ⚠️ Exponents with a decimal point: PyYAML loads `1e-4` as a STRING.
lr: 1.0e-4
min_lr: 1.0e-6
warmup_fraction: 0.05
weight_decay: 0.05
ema_decay: 0.999
max_epochs: 50
patience: 10

# SEQUENCES (streams) per batch, ~300 words.
batch_size: 64

# -- augmentation ----------------------------------------------------------
# Jitter shifts a whole stream's start, so all its words move together.
jitter_seconds: 0.03
component_dropout: 0.1
gaussian_noise: 0.1

# -- controls and diagnostics ----------------------------------------------
shuffle_labels: false
grad_probe_every: 50
