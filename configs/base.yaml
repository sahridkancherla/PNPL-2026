# Shared defaults. Override per-run with a second file.
track: deep

tmin: 0.0
tmax: 1.0
sfreq: 250
n_channels: 306
n_classes: 50

# BAcc@k is the scored metric; chance is k/n_classes (0.20 at k=10).
metric_k: 10

# Sessions held out for validation; empty = auto-select by val_fraction below.
val_sessions: []

# Used when val_sessions is empty: hold out whole sessions from the end
# until they cover this fraction of samples. Session sizes vary ~30x.
val_fraction: 0.1

model: cnn_baseline
model_kwargs: {}

lr: 1e-5
weight_decay: 0.0
batch_size: 64
max_epochs: 50   # early stopping ends the run before this in practice
patience: 5
num_workers: 8   # match ncpus in the PBS script; loader is the bottleneck
seed: 0
