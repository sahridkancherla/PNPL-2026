# Trial 10 on CX3: the machine-shaped knobs only. Layered after trial10.yaml
# and before the run file, so every run gets the same machine.

# ⚠️ Must equal ncpus in pbs/trial10.pbs.
num_workers: 8

# fp16 autocast with loss scaling, for the RTX6000 that pbs/trial10.pbs asks
# for: Turing has fp16 tensor cores but no bf16. The SigLIP loss and the
# retrieval scores run in float32 regardless. On an L40S (Ada) use bf16-mixed,
# and change gpu_type in pbs/trial10.pbs with it.
precision: 16-mixed

# No thermal budget on a compute node: run flat out.
duty_cycle: 1.0
cooldown_every_minutes: 0.0
cooldown_seconds: 0.0

# cuda, not auto: auto falls back to the CPU without a word when no GPU is
# visible, and a CPU run quietly fills the whole walltime.
accelerator: cuda
