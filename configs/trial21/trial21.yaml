# Trial 21: train on the holdout's own session and format. This file IS trial
# 20's SPW -- the continuous family with the word tower and the phoneme head
# -- plus trial 21's switches at their off values, so each run file says the
# one thing it changes (src/pnpl2026/trial21/info/holdout-adaptation.md).
#
# Layer order:  base.yaml -> trial21/trial21.yaml -> trial21/hpc.yaml -> one
# run file. model_kwargs merges key by key (trial21/config.py).
#
# Reads trial 10's cache and t5 table, trial 19's phoneme labels and the word
# descriptions; builds none of them. Part A (distillation) is not a training
# run: see pbs/trial21_distil.pbs and configs/trial21/distil.txt.

# ⚠️ every run file overrides this
run_name: trial21

model: trial21_continuous

# -- data: trial 10's reference cache, 306 sensors at 50 Hz --------------------
cache_dir: data/trial10_reference
word_embeddings: data/word_embeddings_t5_all.npz
centre_embeddings: false
n_channels: 306
sfreq: 50

# The per-word window is only the "full" tail now; the per-ITEM baseline is
# the first 0.5 s of each item, clipped at +/-5 as before.
tmin: 0.0
tmax: 3.0
clamp: 5.0
baseline_seconds: 0.5

# Every word of a sentence is a token and a t5 target. Sentences are cut into
# runs of at most 16 words in training, so a span stays under ~8 s.
token_set: all
max_tokens: 16
siglip_dedup: true

# -- selection: the fragment protocol on pnpl's validation partition ----------
selection_protocol: fragment

# -- holdout-shaped training: G2's -------------------------------------------
fragment_p: 0.0
isolated_p: 0.1
fragment_lengths: [3, 1, 3, 25, 56, 38, 24, 12, 3]

# -- how a training span is cut (trial 19) -------------------------------------
whole_tail: holdout
lead_max_seconds: 0.0
marker_drop_p: 0.5
# "scored" is trials 19-20's rule (an item keeps only its list words' markers);
# "random" drops each marker on its own, so the marked set carries no identity.
marker_drop_mode: scored
time_mask_p: 0.0

# -- trial 21: the hybrid stem's warm start, off here ---------------------------
# A per-word checkpoint whose encoder fills a `stem: dascoli`; {seed} is the
# run's seed. "" trains the stem from scratch.
init_encoder_from: ""
init_head: true

# -- SPW's two heads, ON: the base is the best member --------------------------
phoneme_dir: data/trial19_phonemes
phoneme_weight: 0.5
phoneme_lag_seconds: 0.15
word_descriptions: data/word_descriptions.npz
tower_dim: 256
tower_hidden: 512
tower_anchor_weight: 1.0
tower_score_mode: combine

model_kwargs:
  # -- spatial: brainmagick's merger, plus a learned offset per sensor type ----
  spatial: merger
  merger_channels: 270
  merger_pos_dim: 2048
  merger_dropout: 0.2
  merger_type_bias: true
  initial_linear: 270
  subject_layer: true

  # -- the stem: "megstate" (trials 19-20) or "dascoli" (trial 21, the per-word
  #    family's conv stack). Both end in one step per 2 samples (25 steps/s) --
  stem: megstate
  # megstate: MEGState's four kernel lengths, then two LayerNorm blocks
  stem_kernels_ms: [500, 250, 125, 62.5]
  stem_channels: 64
  stem_depth: 2
  stem_kernel: 7
  stem_stride: 2
  # dascoli: trial 10's conv stack -- 10 layers of 160, kernel 3, dilations
  # 1,2,4,8,16 twice, masked BatchNorm, a GLU every second layer
  stem_hidden: 160
  stem_conv_depth: 10
  stem_kernel_size: 3
  stem_dilation_growth: 2
  stem_dilation_period: 5
  stem_batch_norm: true
  stem_glu: 2
  stem_glu_context: 1

  # -- the time transformer: 6 x 256 x 8 heads over the steps ------------------
  d_model: 256
  time_depth: 6
  n_heads: 8
  ffn_expansion: 4
  attention_dropout: 0.1
  dropout: 0.0
  drop_path: 0.0

  # -- the readout: 0.5 s before each onset to 1.5 s after -------------------------
  onset_marker: true
  readout_before_s: 0.5
  readout_after_s: 1.5

  # -- trial 20's word transformer after the readout: off, as in SPW -----------
  word_depth: 0

# -- schedule: trial 10's ---------------------------------------------------------
# ⚠️ Exponents with a decimal point: PyYAML loads `1e-4` as a STRING.
lr: 1.0e-4
weight_decay: 0.01
warmup_fraction: 0.01
min_lr: 0.0
max_epochs: 50
patience: 10

# ITEMS per batch.
batch_size: 64

ema_decay: 0.0
jitter_seconds: 0.0

precision: "32"
matmul_precision: high
num_workers: 4
