# Trial 17: Variant L. This file IS trial 13's G2 -- trial13.yaml plus
# isolated_p: 0.1 -- exactly as trial16.yaml is, so the run file says the one
# thing L changes: holdout runs.
#
# Layer order:  base.yaml -> trial17/trial17.yaml -> trial17/hpc.yaml -> one
# run file. model_kwargs merges key by key (trial17/config.py).
#
# Reads trial 10's cache and t5 table; builds neither. See
# src/pnpl2026/trial17/info/variant-l.md.

# ⚠️ every run file overrides this
run_name: trial17

model: trial17_reference

# -- data: trial 10's reference cache, 306 sensors at 50 Hz --------------------
cache_dir: data/trial10_reference
word_embeddings: data/word_embeddings_t5_all.npz
centre_embeddings: false
n_channels: 306
sfreq: 50

# 3 s from each word's onset; per window, clip to +/-5, then subtract each
# channel's mean over the first 0.5 s.
tmin: 0.0
tmax: 3.0
clamp: 5.0
baseline_seconds: 0.5

# Every word of a sentence is a token and a t5 target.
token_set: all
max_tokens: 64
siglip_dedup: true

# -- selection: the fragment protocol on pnpl's validation partition ----------
# As trial 13, so L is selected exactly as G2 was.
selection_protocol: fragment

# -- holdout-shaped training: G2's -------------------------------------------
# A tenth of each epoch's sentences served as one word alone with exactly 1 s.
fragment_p: 0.0
isolated_p: 0.1
fragment_lengths: [3, 1, 3, 25, 56, 38, 24, 12, 3]

model_kwargs:
  # -- trial 15's switch: off, as in G2 (on, it cost 6-7 points) ------------------
  input_norm: none

  # -- per-word encoder: trial 10's, brainmagick's SimpleConv ------------------
  spatial: merger
  merger_channels: 270
  merger_pos_dim: 2048
  merger_dropout: 0.2
  initial_linear: 270
  subject_layer: true
  hidden: 160
  depth: 10
  kernel_size: 3
  dilation_growth: 2
  dilation_period: 5
  batch_norm: true
  skip: true
  glu: 2
  glu_context: 1

  # -- the sentence transformer at F1's size: 4 x 256 x 8 heads (5.85M total) --
  d_model: 256
  sentence_depth: 4
  n_heads: 8
  ffn_expansion: 4
  attention_dropout: 0.1
  dropout: 0.0
  drop_path: 0.0

# -- schedule: trial 10's ---------------------------------------------------------
# ⚠️ Exponents with a decimal point: PyYAML loads `1e-4` as a STRING.
lr: 1.0e-4
weight_decay: 0.01
warmup_fraction: 0.01
min_lr: 0.0
max_epochs: 50
patience: 10

# SENTENCES per batch; a fragment or isolated item still counts as one.
batch_size: 64

# Off, as in G2.
ema_decay: 0.0
jitter_seconds: 0.0

precision: "32"
matmul_precision: high
num_workers: 4
