[project]
name = "pnpl-2026"
version = "0.1.0"
description = "LibriBrain / PNPL 2026 MEG decoding experiments"
license = { file = "LICENSE" }
authors = [{ name = "Sahrid Kancherla", email = "surendra.ka@gmail.com" }]
# torch publishes no cp314 wheels on the CUDA index; capping at <3.14 stops uv
# from resolving against a Python it cannot install torch for.
requires-python = ">=3.12,<3.14"

dependencies = [
    "torch>=2.11.0",
    "torchaudio>=2.11.0",
    "pnpl>=0.2.0",
    "lightning>=2.6.5",
    "tensorboard>=2.21.0",
    "matplotlib>=3.11.1",
    "scikit-learn>=1.9.0",
    "scipy>=1.13.1",
    "pandas>=3.0.5",
    "numpy>=2.5.2",
    "pyyaml>=6.0.2",
]

[dependency-groups]
dev = [
    "ipykernel>=6.30.0",
    "jupyter>=1.1.1",
]

# This is a collection of scripts under src/, not an installable library.
[tool.uv]
package = false

# torch/torchaudio come from PyTorch's CUDA 12.8 index rather than PyPI, so the
# build matches the local RTX 3060. `explicit = true` keeps every other package
# resolving from PyPI.
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu128" }]
torchaudio = [{ index = "pytorch-cu128" }]
